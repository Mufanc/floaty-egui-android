[package]
name = "floaty-egui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Render egui into an always-on-top Android SurfaceControl layer"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "floaty-egui"
path = "src/main.rs"

[dependencies]
android_logger = "0.15"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
egui = "0.36"
egui_glow = "0.36"
jni = "0.22"
khronos-egl = { version = "6.0", features = ["dynamic"] }
log = "0.4"
memfd = "0.6"
ndk-sys = "0.6"
rustix = "1.1"
